<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MahimJ Earth</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
  <script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/';</script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="globe"></div>

  <aside id="panel">
    <header>
      <h1>🌍 MahimJ Earth</h1>
      <button id="togglePanel" title="Collapse panel">−</button>
    </header>

    <div id="panelBody">
      <form id="searchForm" autocomplete="off">
        <input id="searchInput" type="search" placeholder="Search a place, city, landmark…" />
        <button type="submit">Fly</button>
      </form>
      <ul id="searchResults"></ul>

      <section>
        <h2>Map style</h2>
        <div class="chips" id="layerChips">
          <button data-layer="satellite" class="active">Satellite</button>
          <button data-layer="streets">Streets</button>
          <button data-layer="dark">Dark</button>
        </div>
        <label class="toggle"><input type="checkbox" id="labelsToggle" checked /> Place labels &amp; borders</label>
        <label class="toggle"><input type="checkbox" id="lightingToggle" /> Day / night lighting</label>
        <label class="toggle"><input type="checkbox" id="spinToggle" /> Auto-rotate globe</label>
      </section>

      <section>
        <h2>Explore the world</h2>
        <div class="tour" id="tour"></div>
      </section>

      <section class="row">
        <button id="myLocation">📍 My location</button>
        <button id="homeBtn">🏠 Home</button>
        <button id="clearPins">🧹 Clear pins</button>
      </section>

      <p class="hint">Drag to rotate · Scroll to zoom · Right-drag / Ctrl-drag to tilt · Double-click to drop a pin</p>
    </div>
  </aside>

  <div id="status">
    <span id="cursorPos">Move over the globe</span>
    <span id="cameraAlt"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
